# Comprova o RNF02 (Python 3.10+ em Windows, Linux e macOS) a cada envio.
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar os testes
        run: python -m pytest -q -m "not slow" --cov=xadrez --cov-report=term --ct-report=build/relatorio_ct.json
      - name: Guardar o relatório dos casos de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-ct-${{ matrix.os }}-py${{ matrix.python-version }}
          path: build/relatorio_ct.json
          if-no-files-found: warn
