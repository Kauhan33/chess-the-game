[project]
name = "chess-the-game"
version = "1.1.0"
description = "Xadrez 3D low-poly em Python, para 2 jogadores, contra a CPU ou em rede local, com pipeline gráfico próprio"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5", "numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ct(id): vincula o teste a um caso de teste formal da documentação (ex.: CT-01)",
    "slow: testes demorados (perft profundo)",
]

[tool.coverage.run]
source = ["xadrez"]
branch = true
